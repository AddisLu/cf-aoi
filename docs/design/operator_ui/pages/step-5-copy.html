<!-- @dsCard group="流程 Steps" -->
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Step 5 套用到其他相機（精簡版）</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--ok:#16a34a;
--ok-bg:#ecfdf5;--off-bg:#f3f4f6;--accent-bg:#eef2ff}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:860px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ph h3{font-size:14px}
.hbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:22px}
h4{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600}
.src{border:1px solid var(--line);border-radius:10px;padding:12px}
.kv{display:grid;grid-template-columns:1fr auto;row-gap:6px;font-size:13px}
.kv .v{font-weight:700;font-family:ui-monospace,monospace}
.inc label{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:13px}
.i{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--off-bg);color:var(--muted);font-size:11px;align-items:center;justify-content:center;font-weight:700;cursor:help;margin-left:auto}
.tgt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px}
.tgt.on{border-color:var(--accent);background:var(--accent-bg)}
.tgt .n{font-weight:700;width:56px}
.tgt .meta{font-size:11px;color:var(--muted);flex:1}
.st{font-size:11px;font-weight:700}
.st.done{color:var(--ok)}.st.skip{color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 24px;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px}
.selrow{display:flex;gap:12px;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px;cursor:pointer}
.band{background:var(--ok-bg);color:var(--ok);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;margin-top:12px}
</style></head><body>
<div class="panel">
  <div class="ph"><h3>套用到其他相機 — 來源 CCD00</h3><button class="hbtn">?</button></div>
  <div class="grid">
  <div>
    <h4>複製什麼</h4>
    <div class="src">
      <div class="kv">
        <span>BTH / DTH</span><span class="v">1.40 / 0.58</span>
        <span>Pitch X/Y</span><span class="v">26 / 18</span>
        <span>曝光 / 增益</span><span class="v">2000 / 2047</span>
      </div>
      <div class="inc">
        <label><input type="checkbox" checked>檢測參數</label>
        <label><input type="checkbox" checked>曝光 / 增益</label>
        <label><input type="checkbox">對位 Mark <span class="i">i</span></label>
      </div>
    </div>
  </div>
  <div>
    <h4>套用到誰</h4>
    <div class="selrow"><span>全選</span><span>只選已綁定</span><span>清除</span></div>
    <div class="tgt on"><input type="checkbox" checked><span class="n">CCD01</span>
      <span class="meta">raL4096</span><span class="st done">✓</span></div>
    <div class="tgt on"><input type="checkbox" checked><span class="n">CCD02</span>
      <span class="meta">raL8192</span><span class="st done">✓</span></div>
    <div class="tgt on"><input type="checkbox" checked><span class="n">CCD03</span>
      <span class="meta">raL8192</span><span class="st done">✓</span></div>
    <div class="tgt"><input type="checkbox" disabled><span class="n">CCD04</span>
      <span class="meta">離線</span><span class="st skip">部分</span></div>
    <div class="tgt"><input type="checkbox" disabled><span class="n">CCD05</span>
      <span class="meta">空槽</span><span class="st skip">—</span></div>
    <button class="btn">套用到 3 台</button>
    <div class="band">✓ 完成 — 建議每台回 Step 4 各 Test 一次</div>
  </div>
  </div>
</div>
</body></html>
