<!-- @dsCard group="Pages" -->
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>相機工作台 — 整頁版面（精簡版）</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--off:#9ca3af;
--ok-bg:#ecfdf5;--warn-bg:#fffbeb;--off-bg:#f3f4f6;--accent-bg:#eef2ff}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-ok i{background:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}.c-warn i{background:var(--warn)}
.c-off{background:var(--off-bg);color:var(--off)}.c-off i{background:var(--off)}
.top{display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px}
.top h1{font-size:16px}
.kpi{display:flex;gap:14px;margin-left:auto;font-size:12px;color:var(--muted)}
.kpi b{color:var(--ink);font-size:15px}
.hbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted);cursor:pointer}
.wrap{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 49px)}
.rail{border-right:1px solid var(--line);background:#fbfbfc;padding:12px;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--off);border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
.card.ok{border-left-color:var(--ok)}.card.warn{border-left-color:var(--warn)}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card .r{display:flex;justify-content:space-between;align-items:center}
.card .slot{font-weight:700}
.card .meta{font-size:11px;color:var(--muted)}
.main{padding:18px 24px;overflow-y:auto}
.ident{display:flex;align-items:baseline;gap:12px}
.ident h2{font-size:20px}
.ident .meta{color:var(--muted);font-size:12px}
.steps{display:flex;gap:8px;margin:14px 0 18px}
.step{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--off-bg);display:flex;align-items:center;justify-content:center;font-size:12px}
.step.done{color:var(--ink)}.step.done .n{background:var(--ok);color:#fff}
.step.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.step.cur .n{background:var(--accent);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:300px}
.btn{background:var(--accent);color:#fff;border-radius:9px;padding:11px 24px;font-weight:700;font-size:14px;border:none;cursor:pointer}
.btn.ghost{background:var(--off-bg);color:var(--ink)}
.big{font-size:38px;font-weight:800}
.row{display:flex;gap:26px;align-items:center;margin-bottom:18px}
.rsub{font-size:11px;color:var(--muted)}
.wall{display:flex;gap:8px}
.p{width:76px;height:76px;background:var(--off-bg);border-radius:8px}
</style></head><body>

<div class="top">
  <h1>相機工作台</h1>
  <span class="chip c-ok"><i></i>Grab</span>
  <span class="chip c-ok"><i></i>IP</span>
  <div class="kpi"><span>已綁定 <b>4</b>/6</span><span>在線 <b>5</b></span><span>待處理 <b style="color:var(--warn)">2</b></span></div>
  <button class="hbtn">?</button>
</div>

<div class="wrap">
  <div class="rail">
    <div class="card ok sel"><div class="r"><span class="slot">CCD00</span><span class="chip c-ok"><i></i>已綁定</span></div>
      <div class="meta">raL8192 · mean 90.4</div></div>
    <div class="card ok"><div class="r"><span class="slot">CCD01</span><span class="chip c-ok"><i></i>已綁定</span></div>
      <div class="meta">raL4096 · mean 87.2</div></div>
    <div class="card warn"><div class="r"><span class="slot">CCD02</span><span class="chip c-warn"><i></i>未綁定</span></div>
      <div class="meta">候選 1 台</div></div>
    <div class="card ok"><div class="r"><span class="slot">CCD03</span><span class="chip c-ok"><i></i>已綁定</span></div>
      <div class="meta">raL8192 · 未取像</div></div>
    <div class="card"><div class="r"><span class="slot">CCD04</span><span class="chip c-off"><i></i>離線</span></div>
      <div class="meta">10:42 前在線</div></div>
    <div class="card" style="opacity:.6"><div class="r"><span class="slot">CCD05</span><span class="chip c-off"><i></i>空槽</span></div>
      <div class="meta">—</div></div>
    <div class="card warn" style="margin-top:16px"><div class="r"><span class="slot" style="font-size:12px">未指派</span>
      <span class="chip c-warn"><i></i>1 台</span></div>
      <div class="meta">…:0B:11 raL8192</div></div>
  </div>

  <div class="main">
    <div class="ident">
      <h2>CCD00</h2>
      <span class="meta">raL8192-12gm · SN 25445953 · 192.168.5.1</span>
      <span class="chip c-ok"><i></i>已綁定</span>
    </div>

    <div class="steps">
      <div class="step done"><span class="n">✓</span>綁定</div>
      <div class="step done"><span class="n">✓</span>取像</div>
      <div class="step done"><span class="n">✓</span>對位</div>
      <div class="step cur"><span class="n">4</span>調參</div>
      <div class="step"><span class="n">5</span>套用</div>
    </div>

    <div class="panel">
      <div class="row">
        <div><div class="big" style="color:var(--ok)">7</div><div class="rsub">缺陷</div></div>
        <button class="btn">▶ Test</button>
        <button class="btn ghost">FFT 估 Pitch</button>
      </div>
      <div class="wall"><div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">+4</div></div>
    </div>
  </div>
</div>
</body></html>
