<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Step 2 取像驗證（精簡版）</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;
--ok-bg:#ecfdf5;--warn-bg:#fffbeb;--off-bg:#f3f4f6;--accent-bg:#eef2ff}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:840px}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:24px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;grid-column:1/-1}
.ph h3{font-size:14px}
.hbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--off-bg);color:var(--ink)}
.big{font-size:46px;font-weight:800;line-height:1}
.judg{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ok-bg);color:var(--ok)}
.i{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--off-bg);color:var(--muted);font-size:11px;align-items:center;justify-content:center;font-weight:700;cursor:help;vertical-align:2px}
.tipwrap{position:relative;display:inline-block}
.tip{position:absolute;left:24px;top:-8px;width:190px;background:#1a1d21;color:#fff;border-radius:9px;padding:8px 11px;font-size:11px;line-height:1.5;z-index:2}
.tip:before{content:"";position:absolute;left:-5px;top:12px;border:5px solid transparent;border-right-color:#1a1d21}
.slider{margin:16px 0}
.slider .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.slider .l b{color:var(--ink);font-size:14px}
.track{height:6px;background:var(--off-bg);border-radius:3px;position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.track .knob{position:absolute;top:-5px;width:16px;height:16px;background:#fff;border:2px solid var(--accent);border-radius:50%}
.preview{background:#0f1115;border-radius:10px;height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#8b949e;font-size:11px}
.pv{width:88%;height:140px;background:repeating-linear-gradient(90deg,#2a2f3a 0 3px,#232833 3px 6px);border-radius:4px}
.row{display:flex;gap:10px;margin-top:16px}
</style></head><body>
<div class="panel"><div class="grid">
  <div class="ph"><h3>取像驗證 — CCD00</h3><button class="hbtn">?</button></div>
  <div>
    <div style="font-size:12px;color:var(--muted)">mean_gray
      <span class="tipwrap"><span class="i">i</span>
      <span class="tip">&lt;3＝暗場（沒開光源），非相機故障。工作點 ≈90。</span></span>
    </div>
    <div class="big">90.4</div>
    <span class="judg">✓ 亮度正常</span>
    <div class="slider">
      <div class="l"><span>曝光 µs</span><b>2000</b></div>
      <div class="track"><div class="fill" style="width:20%"></div><div class="knob" style="left:20%"></div></div>
    </div>
    <div class="slider">
      <div class="l"><span>增益 raw</span><b>2047</b></div>
      <div class="track"><div class="fill" style="width:100%"></div><div class="knob" style="right:-2px"></div></div>
    </div>
    <div class="row">
      <button class="btn">抓一幀</button>
      <button class="btn ghost">套用並再抓</button>
    </div>
  </div>
  <div>
    <div class="preview"><div class="pv"></div><span>點擊放大 · 1:1</span></div>
  </div>
</div></div>
</body></html>
