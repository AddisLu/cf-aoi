<!-- @dsCard group="流程 Steps" -->
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Step 4 調參與缺陷（精簡版）</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;--err:#dc2626;
--ok-bg:#ecfdf5;--warn-bg:#fffbeb;--err-bg:#fef2f2;--off-bg:#f3f4f6;--accent-bg:#eef2ff}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:960px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ph h3{font-size:14px}
.hbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.toprow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:11px;color:var(--muted)}
.f input{width:84px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:14px;font-weight:600}
.f input.chg{border-color:var(--accent);background:var(--accent-bg)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--off-bg);color:var(--ink)}
.result{display:flex;gap:26px;align-items:center;margin:18px 0 12px}
.big{font-size:42px;font-weight:800;line-height:1;color:var(--ok)}
.rsub{font-size:11px;color:var(--muted)}
.delta{font-size:12px;color:var(--ok);font-weight:700}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.patch{position:relative;border-radius:8px;border:2px solid transparent;background:#11151c;height:92px;cursor:pointer}
.patch.sel{border-color:var(--accent)}
.dot{position:absolute;top:38px;left:40px;width:10px;height:10px;border-radius:50%;background:#e8eaf0;box-shadow:0 0 8px #fff}
.tag{position:absolute;left:5px;bottom:5px;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800}
.t-t{background:var(--err);color:#fff}.t-p{background:var(--off-bg);color:var(--muted)}.t-u{background:var(--warn-bg);color:var(--warn)}
.foot{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.kbd{background:var(--off-bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-family:ui-monospace,monospace;font-weight:700;color:var(--ink)}
.bar{flex:1;height:8px;background:var(--off-bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:71%;background:var(--ok)}
.adv{font-size:12px;color:var(--accent);font-weight:600;margin-top:12px;cursor:pointer}
</style></head><body>
<div class="panel">
  <div class="ph"><h3>調參與缺陷 — CCD00</h3><button class="hbtn">?</button></div>
  <div class="toprow">
    <div class="f"><label>BTH</label><input value="1.40"></div>
    <div class="f"><label>DTH</label><input class="chg" value="0.58"></div>
    <div class="f"><label>PitchX</label><input value="26"></div>
    <div class="f"><label>PitchY</label><input value="18"></div>
    <button class="btn ghost">FFT 估 Pitch</button>
    <button class="btn">▶ Test</button>
    <button class="btn ghost">儲存配方</button>
  </div>

  <div class="result">
    <div><div class="big">7</div><div class="rsub">缺陷 · 8.9ms</div></div>
    <div><div class="delta">↓ 12 → 7</div><div class="rsub">前次對比</div></div>
    <div style="margin-left:auto" class="rsub"><b style="color:var(--err)">True 2</b> · Particle 3 · 未分類 2</div>
  </div>

  <div class="wall">
    <div class="patch sel"><span class="dot"></span><span class="tag t-u">未分類</span></div>
    <div class="patch"><span class="dot"></span><span class="tag t-t">True</span></div>
    <div class="patch"><span class="dot" style="background:#20242e;box-shadow:none;border:1px solid #3a4050"></span><span class="tag t-p">Particle</span></div>
    <div class="patch"><span class="dot"></span><span class="tag t-p">Particle</span></div>
    <div class="patch"><span class="dot" style="background:#20242e;box-shadow:none;border:1px solid #3a4050"></span><span class="tag t-t">True</span></div>
    <div class="patch"><span class="dot"></span><span class="tag t-p">Particle</span></div>
    <div class="patch"><span class="dot"></span><span class="tag t-u">未分類</span></div>
  </div>

  <div class="foot">
    <span><span class="kbd">T</span> 真缺陷</span><span><span class="kbd">P</span> 誤判</span>
    <span>AI 標註</span><div class="bar"><i></i></div><span>142/200</span>
  </div>
  <div class="adv">進階參數（27 欄）▾</div>
</div>
</body></html>
