<!-- @dsCard group="流程 Steps" -->
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Step 1 綁定（精簡版：綁定/解除/衝突）</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--ok:#16a34a;--err:#dc2626;
--ok-bg:#ecfdf5;--err-bg:#fef2f2;--off-bg:#f3f4f6;--accent-bg:#eef2ff}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:1150px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel h3{font-size:14px}
.i{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--off-bg);color:var(--muted);font-size:11px;align-items:center;justify-content:center;font-weight:700;cursor:help}
.mono{font-family:ui-monospace,monospace;font-size:11px}
.cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.cand.sel{border-color:var(--accent);background:var(--accent-bg)}
.cand .info{flex:1}.cand b{font-size:13px}
.cand .meta{font-size:11px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 20px;font-weight:700;font-size:13px;cursor:pointer}
.btn.sm{padding:7px 14px;font-size:12px}
.btn.danger{background:#fff;color:var(--err);border:1.5px solid var(--err)}
.btn.ghost{background:var(--off-bg);color:var(--ink)}
.kv{display:grid;grid-template-columns:64px 1fr;row-gap:7px;font-size:13px;margin-bottom:12px}
.kv .k{color:var(--muted)}
.band{border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;margin-bottom:12px}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-err{background:var(--err-bg);color:var(--err)}
.modal{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;box-shadow:0 8px 26px rgba(0,0,0,.12);background:var(--surface)}
.modal p{font-size:13px;margin-bottom:12px}
.lbl{font-size:11px;color:var(--muted);margin-bottom:6px}
</style></head><body>
<div class="cols">

<div>
<div class="lbl">A · 綁定（選 → 按，2 步完成）</div>
<div class="panel">
  <div class="ph"><h3>綁定相機到 CCD02</h3><span class="i">i</span></div>
  <div class="cand sel"><input type="radio" checked>
    <div class="info"><b>raL8192</b> · SN …5961<div class="meta mono">…:0B:11 · WGE1/0/37</div></div>
    <span class="mono" style="color:var(--ok)">在線</span></div>
  <div class="cand"><input type="radio">
    <div class="info"><b>raL8192</b> · SN …5972<div class="meta mono">…:0B:24</div></div>
    <span class="mono" style="color:var(--ok)">在線</span></div>
  <button class="btn">綁定</button>
</div>
</div>

<div>
<div class="lbl">B · 已綁定 → 解除（二段確認）</div>
<div class="panel">
  <div class="ph"><h3>CCD00</h3><span class="i">i</span></div>
  <div class="band b-ok">✓ 綁定正常</div>
  <div class="kv">
    <span class="k">型號</span><span>raL8192-12gm</span>
    <span class="k">SN</span><span>25445953</span>
    <span class="k">MAC</span><span class="mono">00:30:53:53:19:41</span>
    <span class="k">IP</span><span class="mono">192.168.5.1</span>
  </div>
  <button class="btn danger sm">解除綁定…</button>
  <div class="modal">
    <p>解除 <b>CCD00</b> 的綁定？</p>
    <button class="btn danger sm">解除</button>
    <button class="btn ghost sm">取消</button>
  </div>
</div>
</div>

<div>
<div class="lbl">C · MAC 不符 → 二選一出口</div>
<div class="panel">
  <div class="ph"><h3>CCD03</h3><span class="i">i</span></div>
  <div class="band b-err">✗ MAC 不符</div>
  <div class="kv">
    <span class="k">預期</span><span class="mono">…:0B:24</span>
    <span class="k">實際</span><span class="mono">…:0B:31</span>
  </div>
  <button class="btn ghost sm">去檢查接線</button>
  <button class="btn sm" style="margin-left:6px">改綁這台</button>
</div>
</div>

</div>
</body></html>
